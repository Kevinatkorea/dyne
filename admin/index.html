<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>다인스케치 관리자</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <div id="admin-root">
    <div class="boot">불러오는 중…</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    /* 관리자 스크립트 로더.
       배포 시 server/scripts/build.js 가 /dist/admin/*.js 를 만들어 두면 그것을 쓰고,
       없으면(로컬 개발) Babel standalone 으로 그 자리에서 컴파일한다. */
    (function () {
      var FILES = ["api", "ui", "dashboard", "inquiries", "portfolio", "content",
                   "media", "stats", "settings", "users", "audit", "app"];

      function loadSeq(list, make, done) {
        var i = 0;
        (function next() {
          if (i >= list.length) return done && done();
          var el = make(list[i++]);
          el.onload = next;
          el.onerror = function () {
            document.getElementById("admin-root").innerHTML =
              '<div class="boot boot--err">관리자 스크립트를 불러오지 못했습니다.<br>' +
              '서버 로그를 확인하세요.</div>';
          };
          document.body.appendChild(el);
        })();
      }

      function useBuilt() {
        loadSeq(FILES, function (n) {
          var s = document.createElement("script");
          s.src = "/dist/admin/" + n + ".js";
          return s;
        });
      }

      function useBabel() {
        var b = document.createElement("script");
        b.src = "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js";
        b.onload = function () {
          loadSeq(FILES, function (n) {
            var s = document.createElement("script");
            s.type = "text/babel";
            s.setAttribute("data-presets", "react");
            s.src = "/admin/src/" + n + ".jsx";
            return s;
          });
        };
        document.body.appendChild(b);
      }

      fetch("/dist/admin/app.js", { method: "HEAD" })
        .then(function (r) { r.ok ? useBuilt() : useBabel(); })
        .catch(useBabel);
    })();
  </script>
</body>
</html>
