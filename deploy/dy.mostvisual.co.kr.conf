# =====================================================================
# Apache :80 vhost — dy.mostvisual.co.kr
# root 로 /etc/apache2/sites-enabled/ 에 복사한 뒤
#   apache2ctl configtest && systemctl reload apache2
# =====================================================================
<VirtualHost *:80>
    ServerName dy.mostvisual.co.kr

    # Let's Encrypt HTTP-01 챌린지 경로만 파일로 서빙
    DocumentRoot /home/website/dy.mostvisual.co.kr/webroot
    <Directory /home/website/dy.mostvisual.co.kr/webroot>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/dy.mostvisual.co.kr-error.log
    CustomLog ${APACHE_LOG_DIR}/dy.mostvisual.co.kr-access.log combined
</VirtualHost>
