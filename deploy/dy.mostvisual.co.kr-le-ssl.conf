# =====================================================================
# Apache :443 vhost — dy.mostvisual.co.kr
# 인증서 발급 후 root 로 /etc/apache2/sites-enabled/ 에 복사:
#   certbot certonly --webroot -w /home/website/dy.mostvisual.co.kr/webroot \
#           -d dy.mostvisual.co.kr --non-interactive --agree-tos -m <메일>
#   apache2ctl configtest && systemctl reload apache2
#
# ⚠ certbot --apache 금지 (다른 vhost의 ProxyPass 를 건드린 전례 있음)
# =====================================================================
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dy.mostvisual.co.kr

    ProxyPreserveHost On
    ProxyTimeout 120

    # ACME 챌린지는 프록시하지 않는다 (갱신용)
    ProxyPass /.well-known/acme-challenge !
    Alias /.well-known/acme-challenge /home/website/dy.mostvisual.co.kr/webroot/.well-known/acme-challenge
    <Directory /home/website/dy.mostvisual.co.kr/webroot>
        Require all granted
    </Directory>

    ProxyPass        / http://127.0.0.1:3410/
    ProxyPassReverse / http://127.0.0.1:3410/

    # 포트폴리오 이미지가 커서 업로드 한도를 넉넉히
    LimitRequestBody 52428800

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/dy.mostvisual.co.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dy.mostvisual.co.kr/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/dy.mostvisual.co.kr-error.log
    CustomLog ${APACHE_LOG_DIR}/dy.mostvisual.co.kr-access.log combined
</VirtualHost>
</IfModule>
